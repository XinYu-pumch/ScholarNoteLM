[package]
name = "scholarnotelm"
version = "0.6.0"
description = "A thoughtful workspace for literature research"
authors = ["ScholarNoteLM"]
edition = "2021"
default-run = "scholarnotelm"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }
calamine = "0.26"
roxmltree = "0.20"
quick-xml = "0.37"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
chrono = "0.4"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
